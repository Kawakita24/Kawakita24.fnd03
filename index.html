
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツ01計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ダーツ01計算</h1>

  <div class="container">
    <label for="score">残り点数（1〜180）</label>
    <input
      type="text"
      id="score"
      min="1"
      max="180"
      placeholder="1〜180"
    >

    <label for="throws">残り投数</label>
    <select id="throws">
      <option value="1">1投</option>
      <option value="2">2投</option>
      <option value="3" selected>3投</option>
    </select>

    <button id="calculate">ルートを計算</button>
  </div>

  <h2>計算結果</h2>
  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
